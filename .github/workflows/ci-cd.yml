name: CI/CD - Hanoi Night-Tourism AI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint, Unit Tests & Contrastive Model Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          grep -v "^torch" requirements.txt > /tmp/req_notorch.txt
          pip install -r /tmp/req_notorch.txt pytest httpx ruff

      - name: Lint code with Ruff
        run: ruff check data ml backend tests --select E,F --ignore E501,E402

      - name: Run Unit & FastAPI Integration Tests
        run: pytest -v tests/test_suite.py

      - name: Verify Contrastive Learning Model Benchmarks
        run: |
          python -c "
          import json
          m = json.load(open('ml/checkpoints/metrics.json', encoding='utf-8'))
          cl = m['benchmark_comparison']['two_tower_contrastive_learning']
          print('Contrastive NDCG@10:', cl['ndcg_at_10'], '| Cold-Start Hit@10:', cl['cold_start_hit_at_10'])
          assert cl['ndcg_at_10'] > 0.65, 'Model NDCG@10 below quality gate!'
          "

  docker-build-and-smoke-test:
    name: Build Docker Image & Container Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hanoi-night-tourism-ai:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container & verify live API endpoints
        run: |
          docker run -d --name ci-smoke-app -p 8000:8000 hanoi-night-tourism-ai:ci-test
          echo "Waiting for container startup..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/health; then
              echo ""
              echo "Health check passed!"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health | grep '"status":"ok"'
          curl -fsS -X POST http://localhost:8000/api/recommend \
            -H "Content-Type: application/json" \
            -d '{"query_text":"phố ẩm thực đêm Hoàn Kiếm","start_hour":18.5,"end_hour":23.0,"budget_vnd":400000,"top_k":3}' \
            | grep '"total_returned":3'
          curl -fsS -X POST http://localhost:8000/api/optimize-itinerary \
            -H "Content-Type: application/json" \
            -d '{"query_text":"tour đêm di tích và ẩm thực","start_hour":18.0,"end_hour":23.0,"budget_vnd":500000,"max_stops":4}' \
            | grep '"optimized"'
          docker stop ci-smoke-app && docker rm ci-smoke-app

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
